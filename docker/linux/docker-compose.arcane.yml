services:
  runner:
    image: self-hosted-runner:local
    restart: always
    environment:
      # Arcane writes these values to the managed project's .env after the
      # initial Git Sync has created the project. Empty defaults let that
      # first sync validate without storing a registration token in Git.
      REPO: "${REPO:-}"
      REG_TOKEN: "${REG_TOKEN:-}"
      NAME: "${NAME:-arcane-runner}"
      LABELS: "${LABELS:-}"
      RUNNER_GROUP: "${RUNNER_GROUP:-}"
      WORK_DIR: "${WORK_DIR:-_work}"
      EPHEMERAL: "false"
      # Runner upgrades are delivered through the locally built image. A
      # self-update can replace bin/ while the container is running.
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      - runner-data:/home/docker/actions-runner/.runner-data
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # The first Git Sync has no project .env yet. Keep runners stopped until
    # the required values have been added in Arcane after project creation.
    scale: ${RUNNER_REPLICAS:-0}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '0.4'
          memory: 256M

volumes:
  runner-data:
